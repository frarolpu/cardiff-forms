<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunnel Logbook - Cardiff Forms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d2d44 100%);
            color: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: rgba(52, 211, 153, 0.1);
            border: 2px solid #34d399;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #34d399;
            font-size: 28px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header p {
            color: #cbd5e0;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.07);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.25s;
            border-left: 3px solid #0084ff;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .input-section h3 {
            color: #34d399;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-row {
            display: grid;
            grid-template-columns: 150px 1fr 100px;
            gap: 12px;
            align-items: flex-end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 13px;
            color: #cbd5e0;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea {
            padding: 10px 12px;
            background: rgba(30, 30, 46, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            color: #f5f5f5;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.25s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.1);
            background: rgba(30, 30, 46, 1);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 50px;
            grid-column: 2 / 4;
        }

        .btn-add {
            padding: 10px 20px;
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            color: #1e1e2e;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 14px;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(52, 211, 153, 0.3);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .logbook-entries {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .logbook-entries.empty {
            padding: 40px 20px;
            text-align: center;
            color: #8b94a5;
        }

        .logbook-entries.empty p {
            font-size: 14px;
        }

        .entry {
            display: grid;
            grid-template-columns: 20px 100px 1fr 40px;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            transition: all 0.25s;
            cursor: grab;
            user-select: none;
        }

        .entry:active {
            cursor: grabbing;
        }

        .entry.dragging {
            opacity: 0.5;
            background: rgba(52, 211, 153, 0.1);
        }

        .entry.drag-over {
            border-top: 2px solid #34d399;
            padding-top: 13px;
        }

        .entry-drag-handle {
            color: #34d399;
            font-size: 18px;
            opacity: 0.6;
            transition: opacity 0.25s;
        }

        .entry:hover .entry-drag-handle {
            opacity: 1;
        }

        .entry:last-child {
            border-bottom: none;
        }

        .entry:hover {
            background: rgba(52, 211, 153, 0.05);
        }

        .entry-time {
            font-weight: 600;
            color: #34d399;
            font-size: 15px;
            font-family: 'Courier New', monospace;
        }

        .entry-text {
            color: #f5f5f5;
            font-size: 14px;
            line-height: 1.5;
        }

        .entry-delete {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #ef4444;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .entry-delete:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.05);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-box {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.3);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #cbd5e0;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #34d399;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #f5f5f5;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .no-entries {
            padding: 30px;
            text-align: center;
            color: #8b94a5;
        }

        @media print {
            body {
                background: white;
                color: black;
            }
            .back-link, .btn-add, .btn-secondary, .entry-delete, .input-section {
                display: none;
            }
            .header {
                background: white;
                border: 1px solid #e0e0e0;
                color: black;
            }
            .entry {
                border-color: #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Forms</a>

    <div class="container">
        <div class="header">
            <h1>📋 Tunnel Logbook</h1>
            <p>Minute-by-minute log of all events during tunnel closure</p>
        </div>

        <div class="input-section">
            <h3>Add Log Entry</h3>
            <div class="form-row">
                <div class="form-group">
                    <label for="entryTime">Time</label>
                    <input type="time" id="entryTime" placeholder="HH:MM">
                </div>
                <div class="form-group">
                    <label for="entryText">Event Description</label>
                    <textarea id="entryText" placeholder="e.g., Team entering into the tunnel"></textarea>
                </div>
                <button type="button" class="btn-add" onclick="addLogEntry()">Add</button>
            </div>
        </div>

        <div class="logbook-entries" id="logbookContainer">
            <div class="no-entries">
                <p>No entries yet. Add your first log entry above.</p>
            </div>
        </div>

        <div class="stats" id="statsContainer" style="display: none;">
            <div class="stat-box">
                <div class="stat-label">Total Entries</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">First Entry</div>
                <div class="stat-value" id="statFirst">—</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Last Entry</div>
                <div class="stat-value" id="statLast">—</div>
            </div>
        </div>

        <div class="action-buttons">
            <button type="button" class="btn-secondary" onclick="exportLogbook()">📥 Export CSV</button>
            <button type="button" class="btn-secondary" onclick="printLogbook()">🖨️ Print</button>
            <button type="button" class="btn-secondary" onclick="clearLogbook()" style="margin-left: auto;">🗑️ Clear All</button>
        </div>
    </div>

    <script>
        let logbook = JSON.parse(localStorage.getItem('tunnelLogbook')) || [];

        function renderLogbook() {
            const container = document.getElementById('logbookContainer');
            const statsContainer = document.getElementById('statsContainer');

            if (logbook.length === 0) {
                container.innerHTML = '<div class="no-entries"><p>No entries yet. Add your first log entry above.</p></div>';
                statsContainer.style.display = 'none';
                return;
            }

            statsContainer.style.display = 'grid';
            container.innerHTML = logbook.map((entry, index) => `
                <div class="entry" draggable="true" data-index="${index}" ondragstart="handleDragStart(event)" ondragend="handleDragEnd(event)" ondragover="handleDragOver(event)" ondrop="handleDrop(event)" ondragleave="handleDragLeave(event)">
                    <div class="entry-drag-handle">⋮</div>
                    <div class="entry-time">${entry.time}</div>
                    <div class="entry-text">${escapeHtml(entry.text)}</div>
                    <button type="button" class="entry-delete" onclick="deleteEntry(${index})" title="Delete entry">✕</button>
                </div>
            `).join('');

            container.className = 'logbook-entries';

            // Update stats
            document.getElementById('statTotal').textContent = logbook.length;
            document.getElementById('statFirst').textContent = logbook[0].time;
            document.getElementById('statLast').textContent = logbook[logbook.length - 1].time;
        }

        function addLogEntry() {
            const timeInput = document.getElementById('entryTime');
            const textInput = document.getElementById('entryText');
            const time = timeInput.value.trim();
            const text = textInput.value.trim();

            if (!time || !text) {
                alert('Please fill in both time and event description');
                return;
            }

            logbook.push({ time, text, timestamp: new Date().toISOString() });

            localStorage.setItem('tunnelLogbook', JSON.stringify(logbook));
            
            timeInput.value = '';
            textInput.value = '';
            textInput.focus();

            renderLogbook();
        }

        function deleteEntry(index) {
            if (confirm('Delete this entry?')) {
                logbook.splice(index, 1);
                localStorage.setItem('tunnelLogbook', JSON.stringify(logbook));
                renderLogbook();
            }
        }

        let draggedIndex = null;

        function handleDragStart(event) {
            draggedIndex = parseInt(event.target.closest('.entry').getAttribute('data-index'));
            event.target.closest('.entry').classList.add('dragging');
            event.dataTransfer.effectAllowed = 'move';
        }

        function handleDragEnd(event) {
            event.target.closest('.entry').classList.remove('dragging');
            document.querySelectorAll('.entry').forEach(entry => entry.classList.remove('drag-over'));
            draggedIndex = null;
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            const entry = event.target.closest('.entry');
            if (entry && draggedIndex !== null) {
                entry.classList.add('drag-over');
            }
        }

        function handleDragLeave(event) {
            event.target.closest('.entry').classList.remove('drag-over');
        }

        function handleDrop(event) {
            event.preventDefault();
            const entry = event.target.closest('.entry');
            const dropIndex = parseInt(entry.getAttribute('data-index'));
            
            if (draggedIndex !== null && draggedIndex !== dropIndex) {
                // Remove dragged item
                const draggedItem = logbook.splice(draggedIndex, 1)[0];
                
                // Insert at new position
                if (draggedIndex < dropIndex) {
                    logbook.splice(dropIndex - 1, 0, draggedItem);
                } else {
                    logbook.splice(dropIndex, 0, draggedItem);
                }
                
                localStorage.setItem('tunnelLogbook', JSON.stringify(logbook));
                renderLogbook();
            }
        }

        function exportLogbook() {
            if (logbook.length === 0) {
                alert('No entries to export');
                return;
            }

            let csv = 'Time,Event\n';
            logbook.forEach(entry => {
                csv += `"${entry.time}","${entry.text.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `tunnel_logbook_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function printLogbook() {
            window.print();
        }

        function clearLogbook() {
            if (confirm('Clear all log entries? This cannot be undone.')) {
                logbook = [];
                localStorage.setItem('tunnelLogbook', JSON.stringify(logbook));
                renderLogbook();
                document.getElementById('entryTime').value = '';
                document.getElementById('entryText').value = '';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to add entry
        document.getElementById('entryText').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addLogEntry();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            renderLogbook();
            // Set current time as default
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('entryTime').value = `${hours}:${minutes}`;
        });
    </script>
</body>
</html>
